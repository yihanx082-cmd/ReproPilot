  <text x="85" y="125" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#18212f">PROVISIONAL_SMOKE_RUN</text>
  <g font-family="Arial, sans-serif">
    <rect x="85" y="155" width="235" height="88" rx="10" fill="#f7f9fc"/>
    <text x="103" y="184" font-size="15" fill="#667085">Run status</text><text x="103" y="220" font-size="24" font-weight="700" fill="#18212f">SUCCEEDED</text>
