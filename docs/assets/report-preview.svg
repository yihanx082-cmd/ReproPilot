<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">ReproPilot HTML report preview</title>
  <desc id="desc">A preview of the evidence report with provisional status, credibility score, repair timeline, and metric comparison.</desc>
  <rect width="1200" height="620" fill="#f4f7fb"/>
