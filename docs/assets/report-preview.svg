    <text x="356" y="184" font-size="15" fill="#667085">Credibility score</text><text x="356" y="220" font-size="24" font-weight="700" fill="#18212f">72.5 / 100</text>
    <rect x="591" y="155" width="235" height="88" rx="10" fill="#f7f9fc"/>
    <text x="609" y="184" font-size="15" fill="#667085">Comparable</text><text x="609" y="220" font-size="24" font-weight="700" fill="#b54708">NO</text>
    <rect x="844" y="155" width="270" height="88" rx="10" fill="#f7f9fc"/>
    <text x="862" y="184" font-size="15" fill="#667085">Duration</text><text x="862" y="220" font-size="24" font-weight="700" fill="#18212f">42.50 seconds</text>
    <rect x="85" y="270" width="1029" height="74" rx="10" fill="#fffaeb" stroke="#f79009"/>
    <rect x="85" y="270" width="6" height="74" rx="3" fill="#b54708"/>
    <text x="110" y="301" font-size="17" font-weight="700" fill="#7a2e0e">Scope warning</text>
    <text x="110" y="328" font-size="15" fill="#7a2e0e">Reduced smoke run — results are not comparable to the full paper experiment.</text>
    <text x="85" y="390" font-size="20" font-weight="700" fill="#18212f">Repair timeline</text>
    <line x1="85" y1="408" x2="1114" y2="408" stroke="#d0d5dd"/>
    <text x="98" y="443" font-size="15" fill="#667085">Diagnosis</text><text x="265" y="443" font-size="15" fill="#18212f">Missing torchvision dependency</text>
    <text x="98" y="478" font-size="15" fill="#667085">Patch</text><text x="265" y="478" font-size="15" fill="#175cd3">requirements.txt · 1 changed line · low risk</text>
    <text x="98" y="513" font-size="15" fill="#667085">Targeted test</text><text x="265" y="513" font-size="15" fill="#027a48">exit code 0 · passed</text>
    <text x="760" y="390" font-size="20" font-weight="700" fill="#18212f">Metric comparison</text>
    <text x="760" y="443" font-size="15" fill="#667085">Paper macro-F1</text><text x="1015" y="443" font-size="15" fill="#18212f">0.910</text>
    <text x="760" y="478" font-size="15" fill="#667085">Run mean</text><text x="1015" y="478" font-size="15" fill="#18212f">0.892</text>
    <text x="760" y="513" font-size="15" fill="#667085">Delta</text><text x="1015" y="513" font-size="15" fill="#b54708">−0.018</text>
