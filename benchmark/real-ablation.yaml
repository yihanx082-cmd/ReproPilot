schema_version: 1
cases:
  - id: convmixer-progressive
    repository_url: https://github.com/locuslab/convmixer-cifar10.git
    commit_sha: 2d3d9b73d3caa6112ecdcea866f1d2805f37cc8e
    license: MIT
    allowed_paths: [train.py]
    stages:
      - id: convmixer-missing-dependency
        category: dependency
        root_cause: An undeclared Python dependency was imported by train.py.
        injection: benchmark/real-injections/convmixer_missing_dependency.patch
        probe:
          path: train.py
          forbidden_text: import repropilot_missing_dependency
          failure_message: "ModuleNotFoundError in train.py: No module named 'repropilot_missing_dependency'"
      - id: convmixer-incorrect-dataset-path
        category: path
        root_cause: The CIFAR-10 loaders point to a missing dataset directory.
        injection: benchmark/real-injections/convmixer_incorrect_dataset_path.patch
        probe:
          path: train.py
          forbidden_text: "root='./missing-data'"
          failure_message: "FileNotFoundError in train.py: configured CIFAR-10 root './missing-data' does not exist"

  - id: resnet-progressive
    repository_url: https://github.com/akamaster/pytorch_resnet_cifar10.git
    commit_sha: d5489e8995e81e91ce6b1d69dcc98ad579b0b153
    license: BSD-2-Clause
    allowed_paths: [trainer.py]
    stages:
      - id: resnet-learning-rate-mismatch
        category: configuration
        root_cause: The default learning rate differs from the documented 0.1 experiment.
        injection: benchmark/real-injections/resnet_learning_rate.patch
        probe:
          path: trainer.py
          required_text: "default=0.1, type=float"
          failure_message: "CONFIGURATION ERROR in trainer.py: documented learning_rate=0.1, observed default=0.001"
      - id: resnet-top1-metric-mismatch
        category: metric
        root_cause: Prec@1 is computed with top-k equal to five.
        injection: benchmark/real-injections/resnet_top1_metric.patch
        probe:
          path: trainer.py
          required_text: "def accuracy(output, target, topk=(1,)):"
          failure_message: "METRIC ERROR in trainer.py: reported Prec@1 is computed with a top-k setting inconsistent with top-1"

  - id: lightning-progressive
    repository_url: https://github.com/karasawatakumi/pytorch-image-classification.git
    commit_sha: 4dd18700e9c2eb1787e652326d188e8ecdbac2aa
    license: MIT
    allowed_paths: [train.py]
    stages:
      - id: lightning-cuda-fallback
        category: cuda_runtime
        root_cause: CPU hosts are incorrectly assigned the GPU accelerator.
        injection: benchmark/real-injections/lightning_cuda_fallback.patch
        probe:
          path: train.py
          required_text: 'return "cpu", None, None'
          failure_message: "CUDA ERROR in train.py: CPU-only runner selects a GPU accelerator"
      - id: lightning-validation-shuffle
        category: data
        root_cause: Validation samples are shuffled instead of using deterministic order.
        injection: benchmark/real-injections/lightning_validation_shuffle.patch
        probe:
          path: train.py
          required_text: "shuffle=False,\n            drop_last=False"
          failure_message: "DATASET ERROR in train.py: validation DataLoader order is nondeterministic"
