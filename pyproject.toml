[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repropilot"
version = "0.1.0"
description = "Evidence-backed reproduction and repair agent for ML papers"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "jinja2>=3.1,<4",
    "openai>=2.15,<3",
    "pydantic>=2.10,<3",
    "pymupdf>=1.25,<2",
    "pyyaml>=6.0,<7",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
repropilot = "repropilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/repropilot"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["repropilot"]
mypy_path = "src"
